<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pagamento aprovado | Livro de Receitas do Chef Kaio</title>
<meta name="robots" content="noindex">
<style>
:root{--copper:#dc9650;--muted:#a79d91;--text:#f4efe8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#000;color:var(--text);font-family:Arial,Helvetica,sans-serif;padding:24px}
main{max-width:480px;text-align:center}
.logo{font-size:15px;font-weight:800;letter-spacing:.12em;color:var(--copper);margin-bottom:22px}
h1{font-size:30px;margin:0 0 12px}
p{color:var(--muted);line-height:1.6;margin:0 0 14px}
.btn{display:inline-block;margin:10px 0 16px;background:var(--copper);color:#1a0f05;text-decoration:none;font-weight:800;padding:16px 28px;border-radius:6px;font-size:17px}
.spin{width:38px;height:38px;border:3px solid #2a2622;border-top-color:var(--copper);border-radius:50%;margin:0 auto 18px;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
a{color:var(--copper)}
</style>
</head>
<body>
<main>
  <div class="logo">PANELA DO CHEF</div>
  <div class="spin" id="spin"></div>
  <h1 id="t">Confirmando seu pagamento</h1>
  <p id="p">Isso leva só alguns segundos. Não feche esta página.</p>
  <div id="a"></div>
  <p style="font-size:14px">Dúvidas? Panela do Chef Suporte: <a href="https://wa.me/447511505131">+44 7511 505131</a></p>
</main>
<script>
const API = "https://receitas-chef-kaio.up.railway.app";
const id = new URLSearchParams(location.search).get("session_id");
const t = document.getElementById("t"), p = document.getElementById("p"), a = document.getElementById("a"), spin = document.getElementById("spin");
let tries = 0;
async function check(){
  if(!id){ spin.remove(); t.textContent = "Pedido não encontrado"; p.textContent = "Volte para a página inicial e tente de novo."; return; }
  try{
    const r = await fetch(API + "/api/session/" + encodeURIComponent(id)).then(r => r.json());
    if(r.paid){
      spin.remove();
      t.textContent = (r.name ? r.name + ", seu" : "Seu") + " e-book está liberado!";
      p.textContent = "Pagamento aprovado. Baixe agora pelo botão abaixo. Também enviamos o e-book para " + r.email + ".";
      const b = document.createElement("a"); b.className = "btn"; b.href = r.download; b.textContent = "Baixar o e-book"; a.appendChild(b);
      return;
    }
  }catch(e){}
  if(++tries < 15) return setTimeout(check, 2000);
  spin.remove();
  t.textContent = "Pagamento recebido";
  p.textContent = "A confirmação está demorando um pouco mais que o normal. Assim que for concluída, o e-book chega no seu e-mail.";
}
check();
</script>
</body>
</html>
